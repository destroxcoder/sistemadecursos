{% extends 'base.html' %}
{% block title %}Acceso al Sistema{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="pills-alumno-tab" data-bs-toggle="pill" data-bs-target="#pills-alumno" type="button" role="tab">Soy Alumno</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-admin-tab" data-bs-toggle="pill" data-bs-target="#pills-admin" type="button" role="tab">Administrador</button>
          </li>
        </ul>
        <div class="tab-content" id="pills-tabContent">
          <div class="tab-pane fade show active" id="pills-alumno" role="tabpanel">
            <form method="post">
              <input type="hidden" name="rol" value="alumno">
              <div class="mb-3">
                <label for="dni" class="form-label">DNI</label>
                <input type="text" class="form-control" id="dni" name="dni" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Acceder</button>
              </div>
            </form>
            <div class="mt-3 text-center">
              <a href="{{ url_for('registro') }}">¿Aún no tienes cuenta? Regístrate</a>
            </div>
          </div>
          <div class="tab-pane fade" id="pills-admin" role="tabpanel">
            <form method="post">
              <input type="hidden" name="rol" value="admin">
              <div class="mb-3">
                <label for="codigo" class="form-label">Código de acceso</label>
                <input type="password" class="form-control" id="codigo" name="codigo" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-dark">Entrar al panel</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
